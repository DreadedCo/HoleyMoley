<!DOCTYPE html>
<html>
<head>
    <title>Holey Moley</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>⛳ Holey Moley 🏌️</h1>
    <div class="author">Created by Max.</div>
    <div class="version">v1.0</div>

    <!-- INPUT CARD -->
    <div class="card">
        <form method="post">

            <label>Course Length (ft)</label>
            <input 
                name="length" 
                type="number"
                min="5"
                max="100"
                value="{{form.length}}"
                required
            >

            <label>Course Width (ft)</label>
            <input 
                name="width" 
                type="number"
                min="5"
                max="100"
                value="{{form.width}}"
                required
            >

            <label>Number of Gates</label>
            <select name="gates">
                {% for i in range(0,10) %}
                    <option value="{{i}}" {% if form.gates == i %}selected{% endif %}>
                        {{i}}
                    </option>
                {% endfor %}
            </select>

            <label>Difficulty</label>
            <select name="difficulty">
                <option value="easy" {% if form.difficulty=='easy' %}selected{% endif %}>Easy</option>
                <option value="normal" {% if form.difficulty=='normal' %}selected{% endif %}>Normal</option>
                <option value="hard" {% if form.difficulty=='hard' %}selected{% endif %}>Hard</option>
            </select>

            <br><br>
            <button type="submit">Generate Hole</button>
        </form>
    </div>

    {% if data %}
    <div class="card">
        <h2>Par: {{par}}</h2>

        <canvas id="c"></canvas>

        <script>
            const data = {{ data|tojson }};
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');

            // ============================
            // TRUE ASPECT-RATIO RENDERING
            // ============================
            const maxW = 950;
            const maxH = 600;

            const aspect = data.length / data.width;

            let cw, ch;

            if (aspect > maxW / maxH) {
                cw = maxW;
                ch = maxW / aspect;
            } else {
                ch = maxH;
                cw = maxH * aspect;
            }

            canvas.width = cw;
            canvas.height = ch;

            const scale = cw / data.length;

            const tx = x => x * scale;
            const ty = y => y * scale;

            function drawCircle(x, y, r, c, stroke=false) {
                ctx.beginPath();
                ctx.arc(x, y, r * scale, 0, Math.PI * 2);

                if (stroke) {
                    ctx.strokeStyle = c;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = c;
                    ctx.fill();
                }
            }

            // ============================
            // Faint path (ball → gates → hole)
            // ============================
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();

            ctx.moveTo(tx(data.ball.x), ty(data.ball.y));

            data.gates.forEach(g => {
                ctx.lineTo(
                    tx((g.x1 + g.x2) / 2),
                    ty((g.y1 + g.y2) / 2)
                );
            });

            ctx.lineTo(tx(data.hole.x), ty(data.hole.y));
            ctx.stroke();

            // ============================
            // GATES
            // ============================
            data.gates.forEach(g => {
                ctx.strokeStyle = g.color;
                ctx.lineWidth = 6;

                ctx.beginPath();
                ctx.moveTo(tx(g.x1), ty(g.y1));
                ctx.lineTo(tx(g.x2), ty(g.y2));
                ctx.stroke();

                ctx.fillStyle = 'black';
                ctx.font = 'bold 14px Inter';
                ctx.fillText(
                    g.index,
                    tx((g.x1 + g.x2) / 2),
                    ty((g.y1 + g.y2) / 2)
                );
            });

            // ============================
            // BALL
            // ============================
            drawCircle(tx(data.ball.x), ty(data.ball.y), 0.083, 'white');

            // ============================
            // HOLE + FLAG
            // ============================
            const hx = tx(data.hole.x);
            const hy = ty(data.hole.y);

            drawCircle(hx, hy, 0.208, 'white', true);

            // red flag pole
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(hx, hy);
            ctx.lineTo(hx, hy - 30);
            ctx.stroke();

            // red flag triangle
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.moveTo(hx, hy - 30);
            ctx.lineTo(hx + 12, hy - 24);
            ctx.lineTo(hx, hy - 18);
            ctx.fill();

        </script>

    </div>
    {% endif %}

</div>

</body>
</html>
