<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Holey Moley</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>⛳ Holey Moley 🏌️</h1>
  <div class="subtitle">Created by Max &middot; v1.01</div>

  <div class="card">
    <div class="controls-row">
      <div class="control-group">
        <label>Length &nbsp;<span id="lengthVal">11</span> ft</label>
        <input id="length" type="range" min="5" max="25" value="11"
               oninput="document.getElementById('lengthVal').textContent=this.value">
      </div>
      <div class="control-group">
        <label>Width &nbsp;<span id="widthVal">5</span> ft</label>
        <input id="width" type="range" min="5" max="25" value="5"
               oninput="document.getElementById('widthVal').textContent=this.value">
      </div>
      <div class="control-group">
        <label>Gates</label>
        <select id="gates">
          <option value="0">0</option><option value="1">1</option>
          <option value="2">2</option><option value="3" selected>3</option>
          <option value="4">4</option><option value="5">5</option>
          <option value="6">6</option><option value="7">7</option>
          <option value="8">8</option><option value="9">9</option>
        </select>
      </div>
      <div class="control-group">
        <label>Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>
    <button onclick="generate()">Generate Hole</button>
  </div>

  <div class="card">
    <div class="stats-row">
      <div class="stat-badge hole-badge">
        <div class="stat-label">Hole</div>
        <div class="stat-value" id="holeNum">–</div>
      </div>
      <div class="stat-badge">
        <div class="stat-label">Par</div>
        <div class="stat-value" id="parText">–</div>
      </div>
      <div class="stat-badge">
        <div class="stat-label">Difficulty</div>
        <div class="stat-value" id="rating">–</div>
      </div>
      <div class="stat-badge">
        <div class="stat-label">Distance</div>
        <div class="stat-value" id="totalDist">–</div>
      </div>
      <div class="stat-badge">
        <div class="stat-label">Longest Shot</div>
        <div class="stat-value" id="longestShot">–</div>
      </div>
    </div>
    <canvas id="c"></canvas>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
